<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-labelledby="t">
  <title id="t">Mueble de madera para arenado</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff7ed"/><stop offset="1" stop-color="#fed7aa"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fde68a"/><stop offset=".38" stop-color="#d97706"/><stop offset=".68" stop-color="#b45309"/><stop offset="1" stop-color="#78350f"/></linearGradient>
    <linearGradient id="wood2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbbf24"/><stop offset="1" stop-color="#92400e"/></linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#7c2d12" flood-opacity=".24"/></filter>
  </defs>
  <rect width="500" height="500" rx="48" fill="url(#bg)"/>
